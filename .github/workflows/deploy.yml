name: Build and Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "svelte.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build site & push to isui.ren-heart
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      # Deploy the built static tree to isui.ren-heart@deploy:repo/Octave/.
      # The heart edge middleware serves that path with the COOP/COEP headers
      # the WASM engine requires (see the site-root middleware), so the UI repo
      # only ships bytes and never touches the edge config.
      - name: Deploy to isui.ren-heart@deploy
        env:
          HEART_DEPLOY_KEY: ${{ secrets.HEART_DEPLOY_KEY }}
          REPO_NAME: Octave
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HEART_DEPLOY_KEY" > ~/.ssh/heart_deploy_key
          chmod 600 ~/.ssh/heart_deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'SSHCFG'
          Host github.com
            HostName github.com
            IdentityFile ~/.ssh/heart_deploy_key
            IdentitiesOnly yes
          SSHCFG
          chmod 600 ~/.ssh/config

          rm -rf /tmp/heart-deploy
          git clone --depth 1 --branch deploy \
            git@github.com:ArchivalEra/isui.ren-heart.git \
            /tmp/heart-deploy

          cd /tmp/heart-deploy
          mkdir -p repo/"$REPO_NAME"
          rm -rf repo/"$REPO_NAME"/*
          cp -r "$GITHUB_WORKSPACE/dist/." repo/"$REPO_NAME"/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/"$REPO_NAME"

          if git diff --staged --quiet; then
            echo "No changes in built site to commit."
          else
            git commit -m "deploy: update repo/$REPO_NAME from commit ${GITHUB_SHA:0:8} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin deploy
            echo "Successfully deployed repo/$REPO_NAME to isui.ren-heart@deploy!"
          fi
