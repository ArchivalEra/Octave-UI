# 自动化部署管线：UI 源码 → 构建 → 部署契约施加 → GitHub Pages → (isui.ren 边缘交付)
#
# 设计目标（回应 2026-10-08 交接）：UI 侧怎么改都**不需要重新交接**。交付要求
# （子路径 base / 大二进制 5MB 分片 / 引擎树布局）由本管线在构建期自动施加与断言：
#   scripts/deploy-contract.mjs base   —— 构建前钉死 astro base
#   scripts/deploy-contract.mjs adapt  —— 构建后重写遗漏的根绝对引用 + 注入分片 shim
#   scripts/deploy-contract.mjs verify —— 产物齐备性与形态断言（缺一即失败）
# 契约脚本幂等：UI 侧已经写对的东西不会被改；写漏的由这里兜底。
#
# 为什么经 GitHub Pages 而不是直接上 EdgeOne：octave.wasm ~31MB，EdgeOne 拒绝 >25MB
# 文件；Pages 承载大字节，isui.ren 的边缘中间件反代 + 补 COOP/COEP + 支持 Range 分片。
name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Octave-UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout engine (Octave-Full-Wasm, all lanes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArchivalEra/Octave-Full-Wasm
          ref: master
          path: .engine
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # node 26（26.12.1 起）：2026-10 安全修复线（Brotli RCE / DNS /
          # TLS ×2 四项全修）；check-latest 防 runner 镜像缓存滞后。
          node-version: 26
          check-latest: true
          cache: pnpm

      # ── 部署契约 1/3：构建前钉死 base（UI 忘写/写错都被修正）──
      - name: Contract · base
        run: node scripts/deploy-contract.mjs base

      # ── 引擎树同步：复刻 scripts/sync-lanes.sh + sync-bridge.sh 的产物布局 ──
      # 本地能跑的 dist 结构 = 根级 w64/ + bridge/{w64,assets}/ + lanes/<lane>/ + 根级平铺 JS。
      # 缺根级 w64/ 会让引擎取 w64/octave.wasm 得 404（2026-10-08 踩过）。
      - name: Sync engine lanes and bridge glue
        run: |
          set -euo pipefail
          # ★ 2026-11-07 修复（站侧回信 105 + 站侧 Pages 四连红）：wasm32-final /
          #   IllegalPerformance 分支已被上游删除并**归档为 tag**（pins.json 唯一产地：
          #   archive/wasm32-final-168ef49、archive/master-a1e2409；master 仍是活分支）。
          #   旧命令 fetch 分支名 ⇒ `couldn't find remote ref wasm32-final`，Pages 四连红。
          #   归档 tag 里嵌着 commit 短 SHA（168ef49 / a1e2409），与 pins.json 同源。
          git -C .engine fetch -q origin master 'refs/tags/archive/wasm32-final-168ef49:refs/tags/archive/wasm32-final-168ef49' 'refs/tags/archive/master-a1e2409:refs/tags/archive/master-a1e2409'
          ex() { git -C .engine archive "$1" site; }
          mkdir -p public/bridge public/lanes
          mkdir -p "public/lanes/wasm32-final" "public/lanes/master" "public/lanes/IllegalPerformance"
          ex "archive/wasm32-final-168ef49" | tar -x --strip-components=1 -C "public/lanes/wasm32-final"
          ex "origin/master" | tar -x --strip-components=1 -C "public/lanes/master"
          ex "archive/master-a1e2409" | tar -x --strip-components=1 -C "public/lanes/IllegalPerformance"
          rm -rf /tmp/site && mkdir -p /tmp/site
          ex "archive/master-a1e2409" | tar -x --strip-components=1 -C /tmp/site
          cp -rf /tmp/site/. public/bridge/
          cp -f  /tmp/site/*.js public/ 2>/dev/null || true
          cp -f  /tmp/site/embed-demo.html public/ 2>/dev/null || true
          rm -rf public/w64 && cp -rf /tmp/site/w64 public/w64
          mkdir -p public/assets && cp -rf /tmp/site/assets/. public/assets/ 2>/dev/null || true
          test -f public/w64/octave.wasm
          # ★ 2026-11-07：引擎 archive 的 site/ 里带着**引擎侧旧副本**（assets-loader.js 等，
          #   本仓 public/lanes/*/ 下曾因 DX3 铺开的同族），`cp -rf /tmp/site/. public/bridge/`
          #   会把本仓修复版 bridge 前端盖回旧版（本地不复现——本地不跑这段）。
          #   引擎树只应贡献 lanes/*/ 引擎字节与 w64/ 大字节；bridge/*.js 的唯一产地是本仓。
          git checkout -- public/bridge/ public/assets-loader.js public/compile-worker.mjs 2>/dev/null || true
          test -f public/bridge/assets-loader.js
          echo "ENGINE_SHAS=$(git -C .engine rev-parse --short archive/wasm32-final-168ef49) $(git -C .engine rev-parse --short origin/master) $(git -C .engine rev-parse --short archive/master-a1e2409)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── release 资产同步（MSL + OMC 两件）：**走分发契约**，不是裸 curl ──
      # 旧形态每件都是 `curl .../releases/download/<tag>/<file>` —— 与产品运行期
      # 走的 `catalogue → manifest → chunks → 逐块 sha → 拼接 → 双 sha` 正交
      # （用户：「这样就跟实际路径正交了」「市场不能下不同版本的 release？」）。
      # 现在由 scripts/sync-release-assets.mjs 复用本仓照 Static-Contract
      # 参考客户端移植的 TS 消费侧，按 **entry.name 全表扫 + 权威产地排序**定位
      # release（不猜版本、不手抄 release id），codecs 有序链优先 zstd。
      #
      # 同时修掉一个既有 CI 红：4d1b000 把 public/omc/OpenModelicaCompiler.js
      # 从 git 树删掉、却没同步 deploy-contract 的 must ⇒ main 从那次起 CI 必红
      # （run 42347195522 / 42446442823）。该产物在 OpenModelica-Full-Wasm/v0.2.0-wasm32
      # 的 manifest 里，契约本来就能下。
      #
      # vite-node 是 lockfile 里已有的传递依赖（零新增包）；脚本自身 fail-closed，
      # 故这里不再 sha256sum/stat。
      - name: Sync release assets (distribution contract, TS consumer)
        run: pnpm sync:assets

      # 测试闸门：UI/引擎契约回归在此拦下（16 套件 / 119 用例）。
      - name: Test
        run: pnpm test

      # fzstd 字节拷成站点静态资产（**不进 vite 打包图** —— 用户 2026-11-03：
      # 「fzstd 绝对不能持久存储，但没退出网站前只能拉一次」）。
      # 必须在 build 之前跑：它写 public/lib/，vite 会把 public/ 原样拷进 dist。
      - name: Sync fzstd static asset
        run: node scripts/sync-fzstd.mjs

      - name: Build static site
        run: pnpm build

      # ── 部署契约 2/3：重写遗漏的根绝对引用 + 注入分片 shim ──
      - name: Contract · adapt
        run: node scripts/deploy-contract.mjs adapt

      # ── 静态 gzip 预压缩（gzip -9）：边缘 gzip_static 直供的前提（SITE-ADMIN-REQUEST 申请一）──
      - name: Pre-compress static assets
        run: pnpm compress

      # ── 部署契约 3/3：产物断言（缺件/形态不对 ⇒ 整个流水线红，不推半个站）──
      - name: Contract · verify
        run: node scripts/deploy-contract.mjs verify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
