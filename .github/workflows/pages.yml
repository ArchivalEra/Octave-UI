# 自动化部署管线：UI 源码 → 构建 → 部署契约施加 → GitHub Pages → (isui.ren 边缘交付)
#
# 设计目标（回应 2026-10-08 交接）：UI 侧怎么改都**不需要重新交接**。交付要求
# （子路径 base / 大二进制 5MB 分片 / 引擎树布局）由本管线在构建期自动施加与断言：
#   scripts/deploy-contract.mjs base   —— 构建前钉死 astro base
#   scripts/deploy-contract.mjs adapt  —— 构建后重写遗漏的根绝对引用 + 注入分片 shim
#   scripts/deploy-contract.mjs verify —— 产物齐备性与形态断言（缺一即失败）
# 契约脚本幂等：UI 侧已经写对的东西不会被改；写漏的由这里兜底。
#
# 为什么经 GitHub Pages 而不是直接上 EdgeOne：octave.wasm ~31MB，EdgeOne 拒绝 >25MB
# 文件；Pages 承载大字节，isui.ren 的边缘中间件反代 + 补 COOP/COEP + 支持 Range 分片。
name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Octave-UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout engine (Octave-Full-Wasm, all lanes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArchivalEra/Octave-Full-Wasm
          ref: master
          path: .engine
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # node 26（26.12.1 起）：2026-10 安全修复线（Brotli RCE / DNS /
          # TLS ×2 四项全修）；check-latest 防 runner 镜像缓存滞后。
          node-version: 26
          check-latest: true
          cache: pnpm

      # ── 部署契约 1/3：构建前钉死 base（UI 忘写/写错都被修正）──
      - name: Contract · base
        run: node scripts/deploy-contract.mjs base

      # ── 引擎树同步：复刻 scripts/sync-lanes.sh + sync-bridge.sh 的产物布局 ──
      # 本地能跑的 dist 结构 = 根级 w64/ + bridge/{w64,assets}/ + lanes/<lane>/ + 根级平铺 JS。
      # 缺根级 w64/ 会让引擎取 w64/octave.wasm 得 404（2026-10-08 踩过）。
      - name: Sync engine lanes and bridge glue
        run: |
          set -euo pipefail
          git -C .engine fetch -q origin wasm32-final master IllegalPerformance
          ex() { git -C .engine archive "origin/$1" site; }
          mkdir -p public/bridge public/lanes
          for lane in wasm32-final master IllegalPerformance; do
            mkdir -p "public/lanes/$lane"
            ex "$lane" | tar -x --strip-components=1 -C "public/lanes/$lane"
          done
          rm -rf /tmp/site && mkdir -p /tmp/site
          ex IllegalPerformance | tar -x --strip-components=1 -C /tmp/site
          cp -rf /tmp/site/. public/bridge/
          cp -f  /tmp/site/*.js public/ 2>/dev/null || true
          cp -f  /tmp/site/embed-demo.html public/ 2>/dev/null || true
          rm -rf public/w64 && cp -rf /tmp/site/w64 public/w64
          mkdir -p public/assets && cp -rf /tmp/site/assets/. public/assets/ 2>/dev/null || true
          test -f public/w64/octave.wasm
          echo "ENGINE_SHAS=$(git -C .engine rev-parse --short origin/wasm32-final) $(git -C .engine rev-parse --short origin/master) $(git -C .engine rev-parse --short origin/IllegalPerformance)" >> "$GITHUB_ENV"

      # ── OMC 引擎资产同步（同源托管契约 mail/053）──
      # wasm(74.5MB) 被 .gitignore 排除在 git 树外，构建期从受控源拉取——与引擎三车道
      # 走 git 仓同构。本机路径（site-omc）在 CI runner 上不存在，旧步骤的 if-present
      # 静默跳过曾致线上 /omc/*.wasm 永远 404（2026-10-24 实测抓到）——本步骤 fail-loud：
      # 下载失败 / sha 不符 ⇒ 整条流水线红，绝不绿着缺件。
      # sha 与 DownloadStore.KNOWN_ENGINE_METADATA 同值（下载侧校验的同一指纹）。
      - name: Sync OMC engine assets (release asset, sha-pinned)
        run: |
          set -euo pipefail
          mkdir -p public/omc
          curl -fL --retry 3 -o public/omc/OpenModelicaCompiler_bg.wasm \
            "https://github.com/ArchivalEra/OpenModelica-Full-Wasm/releases/download/v0.1.0-wasm32/OpenModelicaCompiler_bg.wasm"
          echo "8287589ebdb53b4cc37c337c2ae88f798d8889f7ac3c29d693ca12e539b8d001  public/omc/OpenModelicaCompiler_bg.wasm" | sha256sum -c -

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 测试闸门：UI/引擎契约回归在此拦下（16 套件 / 119 用例）。
      - name: Test
        run: pnpm test

      - name: Build static site
        run: pnpm build

      # ── 部署契约 2/3：重写遗漏的根绝对引用 + 注入分片 shim ──
      - name: Contract · adapt
        run: node scripts/deploy-contract.mjs adapt

      # ── 静态 gzip 预压缩（gzip -9）：边缘 gzip_static 直供的前提（SITE-ADMIN-REQUEST 申请一）──
      - name: Pre-compress static assets
        run: pnpm compress

      # ── 部署契约 3/3：产物断言（缺件/形态不对 ⇒ 整个流水线红，不推半个站）──
      - name: Contract · verify
        run: node scripts/deploy-contract.mjs verify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
