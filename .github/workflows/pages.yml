# 构建 Octave-UI 静态站点并发布到 GitHub Pages（archivalera.github.io/Octave-UI/）。
#
# 为什么是 Pages 而不是 EdgeOne：octave.wasm 约 31MB，EdgeOne 拒绝 >25MB 文件。
# 因此大字节由 Pages 承载，isui.ren/repo/Octave/ 由 heart 中间件反代到 Pages，
# 并在反代层补 COOP/COEP（WASM 多线程的 SharedArrayBuffer 前提）。
#
# 引擎来源：公开仓 ArchivalEra/Octave-Full-Wasm 的三条车道分支（site/ 树），
# 对应本仓 scripts/sync-lanes.sh 在开发机从 /mnt/hdd 摄取的那三档。
name: Build and Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "svelte.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Octave-UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout engine (Octave-Full-Wasm, all lanes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArchivalEra/Octave-Full-Wasm
          ref: master
          path: .engine
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # 把三条车道分支的 site/ 树落到 public/lanes/<lane>/，并把公共桥接胶水
      # 落到 public/bridge/ —— 等价于开发机上的 scripts/sync-lanes.sh（它读
      # /mnt/hdd 的本地引擎；CI 从公开引擎仓取同一份 site/ 树）。
      # 复刻 scripts/sync-bridge.sh + sync-lanes.sh 的产物布局（本地能跑的 dist 结构）：
      #   public/w64/          ← 默认车道二进制（引擎按站点根取 w64/octave.wasm）
      #   public/bridge/        ← 胶水 + w64/ + assets/（引擎 baseOf() 指向 bridge/）
      #   public/{*.js,w64,assets} ← 根级平铺（本地是软链到 bridge/，Pages 用实拷贝）
      #   public/lanes/<lane>/  ← 三条工作区车道全树（UI 车道切换器）
      # 之前只放了 lanes/，缺根级 w64/ ⇒ 引擎取 w64/octave.wasm 得 404、根本起不来。
      - name: Sync engine lanes and bridge glue
        run: |
          set -euo pipefail
          git -C .engine fetch -q origin wasm32-final master IllegalPerformance
          ex() { git -C .engine archive "origin/$1" site; }
          mkdir -p public/bridge public/lanes
          for lane in wasm32-final master IllegalPerformance; do
            mkdir -p "public/lanes/$lane"
            ex "$lane" | tar -x --strip-components=1 -C "public/lanes/$lane"
          done
          rm -rf /tmp/site && mkdir -p /tmp/site
          ex IllegalPerformance | tar -x --strip-components=1 -C /tmp/site
          # 默认引擎树（bridge/ + 站点根）
          cp -rf /tmp/site/. public/bridge/
          cp -f  /tmp/site/*.js public/ 2>/dev/null || true
          cp -f  /tmp/site/embed-demo.html public/ 2>/dev/null || true
          rm -rf public/w64 && cp -rf /tmp/site/w64 public/w64
          mkdir -p public/assets && cp -rf /tmp/site/assets/. public/assets/ 2>/dev/null || true
          echo "== root =="; ls public | head -40
          echo "== w64 =="; ls public/w64 | head
          test -f public/w64/octave.wasm && echo "OK: public/w64/octave.wasm present"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
